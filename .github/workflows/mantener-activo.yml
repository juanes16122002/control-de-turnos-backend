# Mantiene despierto el backend en el plan gratuito de Render (se apaga tras 15 min sin tráfico
# y tarda ~1 min en volver), SOLO dentro del horario de operación en hora de Chile.
# Consulta /salud, que hace un SELECT 1: así también genera actividad diaria en Supabase, cuyo plan
# gratuito pausa el proyecto tras ~7 días sin actividad en la base de datos. Si la base no responde,
# /salud devuelve 503 y la ejecución falla (GitHub avisa por correo al dueño del repo).
#
# Configuración (Settings → Secrets and variables → Actions → Variables):
#   BACKEND_URL       (obligatoria)  p. ej. https://control-de-turnos-backend.onrender.com
#   KEEPALIVE_INICIO  (opcional)     hora de inicio en Chile, 0-23. Por defecto 9
#   KEEPALIVE_FIN     (opcional)     hora de término (exclusiva), 0-23. Por defecto 3 (= hasta las 2:59)
#
# Por qué un rango y no 24/7: las 750 h gratuitas mensuales de Render se comparten entre todos los
# servicios gratuitos del workspace (p. ej. contabilidad-backend). 9:00–3:00 ≈ 18 h/día ≈ 540 h/mes.
#
# GitHub solo programa en UTC y Chile alterna UTC-3/UTC-4; por eso se ejecuta cada 10 min y el
# propio job decide con la hora de America/Santiago (siempre correcta, con o sin horario de verano).
#
# Notas: las tareas programadas solo corren desde la rama por defecto (main); GitHub puede retrasarlas
# algunos minutos; en repos públicos se desactivan tras 60 días sin actividad (reactivar en Actions).
name: Mantener backend activo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar el backend si estamos en horario de operación
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          INICIO: ${{ vars.KEEPALIVE_INICIO || '9' }}
          FIN: ${{ vars.KEEPALIVE_FIN || '3' }}
          FORZAR: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL no está definida; nada que hacer."
            exit 0
          fi
          H=$(TZ=America/Santiago date +%-H)
          if [ "$INICIO" -le "$FIN" ]; then
            [ "$H" -ge "$INICIO" ] && [ "$H" -lt "$FIN" ] && EN_HORARIO=1 || EN_HORARIO=0
          else
            # Rango que cruza la medianoche (p. ej. 9 → 3)
            { [ "$H" -ge "$INICIO" ] || [ "$H" -lt "$FIN" ]; } && EN_HORARIO=1 || EN_HORARIO=0
          fi
          echo "Hora en Chile: ${H}:xx | horario ${INICIO}:00–${FIN}:00 | en horario: ${EN_HORARIO}"
          if [ "$EN_HORARIO" != "1" ] && [ "$FORZAR" != "true" ]; then
            echo "Fuera de horario: se deja dormir el servicio para ahorrar horas gratuitas."
            exit 0
          fi
          # Hasta ~2 min de espera por si el servicio estaba dormido
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-delay 10 --retry-all-errors \
            "$BACKEND_URL/salud" -w "\nHTTP %{http_code} en %{time_total}s\n"
